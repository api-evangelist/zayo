tags:
- Fiber
- Network
- Telecom
- Connectivity
description: >-
  Zayo publishes no API plans and no price list. Two distinct commercial facts sit behind that
  single zero, and they should not be collapsed. First, the API itself is free: Zayo's own API
  introduction says "Zayo offers free APIs to help make doing business with Zayo easier" — there
  is no metering, no per-call charge and no paid tier. Second, everything the API transacts —
  dark fiber, wavelengths, Ethernet, IP transit, dedicated internet, CloudLink, DynamicLink,
  managed services — is quoted per route, capacity, term and SLA through the Quote API and the
  Zayo deal desk, and never listed publicly. A quote may come back ICB (individual case basis)
  when deal management needs to review it manually.
plan_count: 0
