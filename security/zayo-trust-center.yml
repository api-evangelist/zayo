compliance:
  page: https://trust.zayo.com/security-program/security-compliance/
  provider_last_updated: '2026-05-27'
  frameworks:
  - name: Common Control Framework (CCF)
    note: Zayo's own control framework, organised into control families.
  - name: Unified Compliance Framework (UCF)
    note: >-
      Zayo states it follows the UCF, which harmonises "key standards including ISO, NIST, SOC
      1 and 2, PCI-DSS, and more" and "laws, regulations, and directives, including CCPA/CPRA,
      DORA, FedRAMP, GDPR, NIS2, TSA, and others". These are framework alignments Zayo maps to,
      not certifications it claims to hold.
  certifications:
  - name: ISO/IEC 27001
    scope: Zayo Europe, France and the United Kingdom
    status: held
  - name: ISO 9001
    scope: Zayo Europe, France and the United Kingdom
    status: held
  - name: ISO 14001
    scope: Zayo Europe, France and the United Kingdom
    status: held
  - name: ISO 45001
    scope: Zayo Europe, France and the United Kingdom
    status: held
  - name: ISO 20243
    scope: Listed among current certifications
    status: held
  - name: SOC 2
    scope: Zayo Group, LLC — Managed Edge and Canadian voice services
    status: held
    artifact: 2025 Zayo Managed Edge SOC 2 audit executive summary, published on the page
  - name: Section 889 NDAA
    scope: Company-wide
    status: statement of compliance
  stated_exclusion: >-
    "Zayo does not hold security certifications for its network transport products, as we do
    not collect, store, or process customer data." Zayo says a company-wide certification
    effort for its other products and services began in 2025, with a third party engaged to
    mature the programme across the US, Canada and European markets.
  api_relevance: >-
    None of the named certifications is scoped to the developer API at api.zayo.com. The API
    handles customer quotes, orders, tickets and invoices, which is exactly the customer data
    the network-transport exclusion says Zayo does not process — the certification scope and
    the API surface do not currently meet.
