description: >-
  Zayo operates a dedicated trust centre at trust.zayo.com covering data protection and
  privacy, governance, risk and resilience, and its security programme, with a named
  security-compliance page listing actual certifications and their scope. It is unusually
  candid: Zayo states plainly which products are certified and which are not, and why.
