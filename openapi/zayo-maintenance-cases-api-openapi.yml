  /services/notifications/v1/generate-auth-token:
    post:
      summary: Generate auth token
      description: "Generating the auth token only needs to be done once, since this auth token will be good for receiving all push notifications associated with your current API token. However, this endpoint may be called as many times as necessary to reset the auth token for additional security. The active auth token is always the most recently generated auth token.\n\n**Workflow to set up push notifications services:**\n\n1. Generate auth token | Generate the auth token to be used in the HTTP header to authenticate invocations to your callback endpoint.\n2. Implement a callback URL endpoint on your infrastructure.\n    The callback URL endpoint must meet the following requirements:\n    \n    ● Implemented on HTTPS\n    \n    ● Accessible from any IP address\n    \n    ● Requires an `Authorization` header with the auth token generated in Step 1\n    \n    ● Rejects (via HTTP 401) a request that does not have an `Authorization` header or has the\n    wrong `Authorization` header\n    \n    ● Accepts a HTTP POST request with a JSON body\n\n3. Register callback URL | Register your endpoint to recieve Maintenance Notifications.\n4. Send test notification | Test out your endpoint."
      operationId: generateAuthToken
      tags:
      - Maintenance Cases
      requestBody:
        description: Required request body containing your grant type, client id and client secret. If you do not have API credentials, please reach out to zayoapi@zayo.com to obtain these.
        required: true
        content:
          application/x-www-form-urlencode:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              properties:
                grant_type:
                  type: string
                  example: client_credentials
                  description: This value will always be client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                  example: openID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                  data:
                    type: object
                    properties:
                      authToken:
                        type: string
                        format: uuid
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
  /services/notifications/v1/register-callback-url:
    post:
      summary: Register callback URL
      description: Once you've implemented a callback URL endpoint in your infrastructure register it with Zayo.
      operationId: registerCallbackUrl
      tags:
      - Maintenance Cases
      requestBody:
        description: Required request body to register your endpoint and subscribe to Maintenance Notifications.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notificationType
              - callbackUrl
              properties:
                notificationType:
                  type: string
                  example: Maintenaance Notifications
                callbackUrl:
                  type: string
                  format: url
                  example: https://sample-zayo-callback-endpoint.com/sampleCallback
                accounts:
                  type: array
                  items:
                    type: string
                    example: 0016000000umyBWAAY, 0014z00001d8bxoAAA, 0010z00001XXXiEAAX
                    description: Billing account ids for which you'd like to recieve updates on. If this is null, all billing account ids will be subscribed for notifications. If you would like to define the billling account ids, please reach out to zayoapi@zayo.com to get a list of billing account ids.
            examples:
              All Values:
                value:
                  notificationType: Maintenance Notifications
                  callbackUrl: https://sample-zayo-callback-endpoint.com/sampleCallback
                  accounts:
                  - 0010z00001XWmYBAA1
                  - 0010z00001XXXiEAAX
                  - 0014z00001d8bxoAAA
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 58bfe26e-38a7-4c67-868a-65f536c3ae51
                        format: uuid
                      target:
                        type: string
                        example: https://4381968a-143c-4195-87db-986c11fb54ce.mock.pstmn.io/sampleCallback
                        format: url
                      notification_type:
                        type: string
                        example: Maintenance Notifications
                      account_id:
                        type: string
                        example: 0016000000unFcJAAU
                      target_account_ids:
                        type: array
                        items:
                          type: string
                          example: 0016000000umyBWAAY, 0010z00001XVx7hAAD, 0010z00001XVxgNAAT, 0010z00001XWdh2AAD, 0014z00001b1FMPAA2, 0014z00001d89HqAAI
                      conditions:
                        type:
                        - 'null'
                        - string
                      enabled:
                        type: boolean
                        example: true
                      created_at:
                        type: string
                        example: '2022-06-28T03:44:45.394Z'
                        format: date-time
                      updated_at:
                        type: string
                        example: '2022-06-28T03:44:45.394Z'
                        format: date-time
                      created_by_username:
                        type: string
                        example: tranzactquote.api@zayo.com
                        format: email
                      created_by_user_id:
                        type: string
                        example: 44a5d370-18a9-11eb-883f-e1dcd53ef907
                        format: uuid
                      target_type:
                        type: string
                        example: CALLBACK_URL
                      target_header:
                        type:
                        - 'null'
                        - string
                      oauth_access_token_header:
                        type:
                        - 'null'
                        - string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
  /services/notifications/v1/send-test-notification:
    post:
      summary: Send test notification
      description: Once the callback URL is registered, you can send test notifications to your registered callback URLs for a particular notification type.
      operationId: sendTestNotification
      tags:
      - Maintenance Cases
      requestBody:
        description: Requireed request body to register your endpoint and subscribe to Maintenance Notifications.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationType:
                  type: string
                  example: Maintenance Notifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: MNN-12345678
                      type:
                        type: string
                        example: Calendar
                      case:
                        type: string
                        example: TTN-0123456789
                      timestamp:
                        type: string
                        example: '2021-01-01T12:00:00'
                        format: date-time
                      urgency:
                        type: string
                        example: Planned
                      levelOfImpact:
                        type: string
                        example: Potential Service Affecting
                      circuitId:
                        type: string
                        example: /xxx/xxxxxx/   /xxx /
                      primaryDate:
                        type: string
                        example: '2021-01-03'
                        format: date
                      x2ndPrimaryDate:
                        type:
                        - 'null'
                        - string
                      x3rdPrimaryDate:
                        type:
                        - 'null'
                        - string
                      fromTime:
                        type: string
                        example: 00:01
                      toTime:
                        type: string
                        example: 05:00
                      timeZone:
                        type: string
                        example: Mountain
                      reasonForMaintenance:
                        type: string
                        example: reason for maintenance
                      location:
                        type: string
                        example: Boulder, CO
                      accountIds:
                        type: array
                        items:
                          type: string
                          example: 0016000000unFcJAAU
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
