openapi: 3.1.0
info:
  version: '1.0'
  title: Zayo APIs Maintenance Cases Quote API
  description: 'Zayo offers free APIs to help make doing business with Zayo easier. The world is shifting from user-led interfaces to system-to-system integration through application programming interfaces.  Zayo, your trusted digital transformation partner, is ready to help. Seamless integration to Zayo’s Customer Portal responds to the growing need for automation. Discover how to expand your network, get quotes, order quotes, and manage your network with our Ticketing and Maintenance Cases API.    '
  x-logo:
    url: https://zayo-ui-bucket.s3-us-west-2.amazonaws.com/Common/Logos/zayo-logo-orange.png
    altText: Zayo orange logo
  contact:
    name: Zayo API Team
    email: zayoapi@zayo.com
servers:
- url: https://api.zayo.com
  description: Production server
security:
- BearerToken: []
- OAuthClientCredentials: []
tags:
- name: Quote
  description: Grow your footprint by reviewing Zayo products in our Product Catalog API, generating quotes with our Quoting API, and automating the ordering process through the Order API.
paths:
  /services/quote-management/v3/quotes/quote:
    post:
      summary: Create or edit quote
      description: Creates a quote using building or location information from the Network Discovery APIs and product code details from the Product Catalog APIs. You can also update an existing quote by passing in the quoteId. Each quote response will include the quote confinguration, `estimatedInstallInterval`, and pricing for multiple terms within the `financialTerms` array.
      operationId: requestQuote
      tags:
      - Quote
      requestBody:
        description: 'Quote request body. This includes 3 major components - `attrs` array, `configuration` object, and `preferences` object. The `configuration` object will vary based on the product code and version, while the `attrs` and `preferences` object will have the same schema for all product codes and versions. '
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/uniCloudLinkQuoteRequest'
              - $ref: '#/components/schemas/uniQuoteRequest'
      responses:
        '200':
          description: Success
