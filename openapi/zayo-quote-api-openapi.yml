      description: Retrieve all NNI records including quotes, orders, and services. Used to identify an NNI to associate with your UNI quote via the `nniId` in the quote request payload. The `nniId` attribute is optional, so if it is omitted from the quote request, Zayo will always default to the nearest NNI.
      operationId: getNNIs
      tags:
      - Quote
      requestBody:
        description: Optional request body to add a filter on `type` of record and to add pagination.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  additionalProperties: false
                  description: Object to define filter options.
                  properties:
                    locationId:
                      type: string
                      pattern: ^a0b
                      example: a0b60000003KP8EAAW
                      minLength: 18
                      maxLength: 18
                    type:
                      type: array
                      maxItems: 3
                      uniqueItems: true
                      default:
                      - Quote
                      - Service Order
                      - Service
                      items:
                        type: string
                        enum:
                        - Quote
                        - Service Order
                        - Service
                      description: Type of NNI record, please note this field is case-sensitive.
                      example:
                      - Service
                paging:
                  type: object
                  additionalProperties: false
                  description: Object to define pagination for the number of records per page, and how many records to skip. Follows odata pagination standards.
                  properties:
                    top:
                      type: integer
                      description: Number of records to be returned per page.
                      example: 50
                      default: 10
                    skip:
                      type: integer
                      description: Number of records to skip.
                      example: 0
                      default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Test Account NNIs:
                  value:
                    apiVersion: v2
                    data:
                      records:
                      - nniId: a0M0z00000PiJ3DEAV
                        custNNI: a1X0z000004aLbmEAE
                        type: Service
                        bandwidth: 10G
                        circuitId: ETYX/TEST008/ZYO
                        name: 559510
                        productCategory: Pt to Multi-Pt (NNI)
                        location: 393 Inverness Pkwy/Fl-1/Rm-DC-04 Englewood, CO 80112
                        locationId: a0b60000000W6LjAAK
                        address: 393 Inverness Pkwy
                        floor: 1
                        suite: null
                        room: DC-04
                        state: CO
                        zip: 80112
                        city: Englewood
                        country: USA
                        sortBy: 1
                      - nniId: a0M0z00000PiJ33EAF
                        custNNI: a1X0z000004aLbcEAE
                        type: Service
                        bandwidth: 1G
                        circuitId: ETYX/TEST005/ZYO
                        name: 559510
                        productCategory: Pt to Multi-Pt (NNI)
                        location: 4100 Bryan St/Fl-1/Rm-LSA 199 Dallas, TX 75204
                        locationId: a0b60000003N9p6AAC
                        address: 4100 Bryan St
                        floor: 1
                        suite: null
                        room: LSA 199
                        state: TX
                        zip: 75204
                        city: Dallas
                        country: USA
                        sortBy: 1
                      metaData:
                        top: 2
                        skip: 0
                        currentPage: 1
                        totalPages: 98
                        totalRecordCount: 195
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
