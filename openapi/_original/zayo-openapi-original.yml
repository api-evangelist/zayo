                  value: 
                    apiVersion: v1
                    error: 
                      errorId: 797ac530-9326-917e-fa38-13d82e065ffe
                      code: 400
                      message: >- 
                        Your ticket has not been picked up yet. To cancel ticket, please cancel by set ticketAction field on request payload as Cancel Ticket
                      errors: []
  /services/service-management/v1/maintenance-cases:
    post:
      summary: Get all maintenance cases
      description: |

        :::warning
        If no date filters are provided in the payload, results will be filtered server side for the Last 30 Days.
        :::


        Retrieve all Maintenance Cases based on filter, search, order by, and pagination options. Maintenance Cases include maintenance event information like urgency, level of impact, status, primary date, second primary date, third primary date, time, time zone, reason for maintenance, location, latitude, and longitude. 


        The recommended flow is to get your Maintenance Case, then use the `caseNumber` or `caseId` as a filter option to receive the impacted circuits for that maintenance event.
      

        To get related services impacted by this event data from the Maintenance Case, pass in the `caseId` or `caseNumber` value as a filter option in the Maintenance Impacts route.
      operationId: getMaintenanceCases
      tags:
        - Maintenance Cases
      requestBody:
        description: Optional body to apply filters, search values, and pagination as well as order by defined attributes to return a specific list of Maintenance Cases. 
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: 
                filter:
                  type: object
                  description: Object to define filter options.
                  additionalProperties: false
                  properties:
                    caseId:
                      $ref: '#/components/schemas/caseId'
                    caseNumber:
                      $ref: '#/components/schemas/caseNumber'
                    levelOfImpact:
                      example: Service Affecting
                      $ref: '#/components/schemas/levelOfImpact'
                    fromTime:
                      $ref: '#/components/schemas/fromTime'
                    location:
                      $ref: '#/components/schemas/location'
                      example: 175 W Cordova St, Vancouver, BC, V6B 1E1
                    latitude:
                      $ref: '#/components/schemas/latitude'
                    longitude:
                      $ref: '#/components/schemas/longitude'
                    primaryDate: 
                      $ref: '#/components/schemas/primaryDate'
                    status:
                      $ref: '#/components/schemas/status'
                      example: Scheduled
                    toTime:
                      $ref: '#/components/schemas/toTime'
                    timeZone:
                      $ref: '#/components/schemas/timeZone'
                    x2ndPrimaryDate:
                      $ref: '#/components/schemas/x2ndPrimaryDate'
                    x3rdPrimaryDate:
                      $ref: '#/components/schemas/x3rdPrimaryDate'
                    urgency:
                      $ref: '#/components/schemas/urgency'
                    or:
                      type: array
                      additionalProperties: false
                      minItems: 2
                      maxItems: 5
                      items:
                        $ref: '#/components/schemas/orFilter'
                orderBy:
                    type: array
                    description: Array to specify results ordering.
                    additionalProperties: false
                    uniqueItems: true
                    items:
                        type: string
                        example: primaryDate desc
                        enum:
                            - caseId
                            - caseId asc
                            - caseId desc
                            - caseNumber
                            - caseNumber asc
                            - caseNumber desc
                            - levelOfImpact
                            - levelofImpact asc
                            - levelOfImpact desc
                            - fromTime
                            - fromTime asc
                            - fromTime desc
                            - location
                            - location asc
                            - location desc
                            - latitude
                            - latitude asc
                            - latitude desc
                            - longitude
                            - longitude asc
                            - longitude desc
                            - primaryDate
                            - primaryDate asc
                            - primaryDate desc
                            - status
                            - status asc
                            - status desc
                            - timeZone
                            - timeZone asc
                            - timeZone desc
                            - toTime
                            - toTime asc
                            - toTime desc
                            - x2ndPrimaryDate
                            - x2ndPrimaryDate asc
                            - x2ndPrimaryDate desc
                            - x3rdPrimaryDate
                            - x3rdPrimaryDate asc
                            - x3rdPrimaryDate desc
                            - urgency
                            - urgency asc
                            - urgency desc
                search:
                    type: string
                    example: DKFB
                    minLength: 1
                paging:
                    type: object
                    additionalProperties: false
                    required:
                        - top
                        - skip
                    description: Object to define pagination for the number of records per page, and how many records to skip. Follows odata pagination standards.
                    properties:
                        top:
                            type: integer
                            description: Number of records to be returned per page.
                            example: 50
                            default: 10
                            maximum: 50
                            minimum: 0
                        skip:
                            type: integer
                            description: Number of records to skip.
                            default: 0
                            minimum: 0
            examples:
              Filters and Order by:
                value:
                  filter:
                    primaryDate:
                      le: 2022-06-29
                  orderBy:
                    - primaryDate desc
                  paging:
                    top: 10
                    skip: 0
      responses:
        '200':
          description: Success
          content: 
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            caseId:
                              type: string
                              example: 5004z00001YdmnOAAR
                            caseNumber:
                              type: string
                              example: TTN-0005305662
                            urgency:
                              type: string
                              example: Demand
                              description: Urgency of the case. Options include - planned (planned in advance and in adherence to the defined standard intervals for services impacted), demand (standard intervals cannot be met, such changes are planned with less than 10 business day’s lead-time), emergency (an immediate need to make changes to the current state of the environment, the immediate need is directly related to an outage, potential outage or degradation of the network).
                            levelOfImpact:
                              type: string
                              example: Service Affecting
                              description: Level of impact the event has on a service, options include - Non-Sevice Affecting, Service Affecting, Potential Service Affecting, HRE-Fiber Splicing, LRE-Fiber Splicing.
                            status:
                              type: string
                              example: Closed
                              description: Status of the Maintenance Case, options include - Scheduled, Rescheduled, Maintenance Started, Maintenance Stopped, Maintenance Completed, Cancelled, and Closed.
                            primaryDate:
                              type: string
                              format: date
                              example: '2021-10-08'
                              description: First date of the Maintenance Event. All Maintenance Cases will have at least a primaryDate.
                            x2ndPrimaryDate:
                              type: ['null', string]
                              format: date
                              example: '2021-07-10'
                              description: Optional second date of the Maintenance Event if it is scheduled for more than 24 hours.
                            x3rdPrimaryDate:
                              type: ['null', string]
                              description: Optional second date of the Maintenance Event if it is scheduled for more than 48 hours.
                            fromTime:
                              type: string
                              example: '00:01'
                              description: Start time of the entire Maintenance Event.
                            toTime:
                              type: string
                              example: '05:00'
                              description: End time of the entire Maintenance Event.
                            timeZone:
                              type: string
                              example: Pacific
                              description: Time zone of the entire Maintenance Event.
                              enum:
                                - Pacific
                                - Mountain
                                - Centrl
                                - Eastern
                                - Atlantic
                                - Newfoundland
                                - GMT
                                - Central Europe
                                - Europe/London
                                - CEST
                                - AST
                                - UTC
                                - CET
                                - NST
                                - BST
                            reasonForMaintenance:
                              type: string
                              example: >-
                                Zayo will be upgrading the provider edge device to fix known
                                issues and improve stability.
                              description: Reason for the Maintenance Event.
                            location:
                              type: string
                              example: 2001 6th Ave, Seattle, WA, 98121
                              description: Location of the Maintenance Event.
                            latitude:
                              type: ['null', number]
                              example: 47.6143693
                              description: Latitude of the Maintenance Event.
                            longitude:
                              type: ['null', number]
                              example: -122.3387104
                              description: Longitude of the Maintenance Event.
                      metadata:
                        type: object
                        properties:
                          top:
                            type: integer
                            example: 10
                          skip:
                            type: integer
                            example: 0
                          currentPage:
                            type: integer
                            example: 1
                          totalPages:
                            type: integer
                            example: 3
                          totalRecordCount:
                            type: integer
                            example: 21
              examples:
                '2022 Events on Test Circuits':
                  value: 
                    apiVersion: v1
                    data:
                      records:
                        - caseId: 5004z00001dIOHFAA4
                          caseNumber: TTN-0005809480
                          urgency: Planned
                          levelOfImpact: Service Affecting
                          status: Closed
                          primaryDate: 2022-06-05
