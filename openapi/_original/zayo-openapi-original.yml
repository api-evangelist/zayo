  /services/service-management/v1/ticket-catalog: 
    get:
      summary: Get ticket catalog
      description: Get the Zayo trouble ticket catalog where tickets are represented as a `ticketType`. For each `ticketType` get the description and latest version.
      operationId: getTicketCatalog
      tags:
        - Ticket Catalog
      responses:
        '200': 
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      ticketTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            ticketType:
                              type: string
                              example: Billing
                              enum:
                                - Billing
                                - Access Request
                                - Remote Hands
                                - Customer Service
                                - Technical Support
                            version:
                              type: string
                              example: 1.0.0
                            description:
                              type: string
                              example: Inquiries related to receivables due on billing accounts.
              examples:
                'Ticket Catalog v1':
                  value:
                    apiVersion: v1
                    data:
                      ticketTypes:
                        - ticketType: Billing
                          version: 1.0.0
                          description: Inquiries related to receivables due on billing accounts.
                        - ticketType: Access Request
                          version: 1.0.0
                          description: Request access into data centers and facilities.
                        - ticketType: Remote Hands
                          version: 1.0.0
                          description: Support on tasks zColo can perform to be your hands and eyes regarding data center functions.
                        - ticketType: Customer Service
                          version: 1.0.0
                          description: Customer support on general questions, service inventory, network documents, service credits and disputes.
                        - ticketType: Technical Support
                          version: 1.0.0
                          description: Trouble ticket creation, escalate service repair issues, and RFO requests.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
  /services/service-management/v1/ticket-type-details/{ticketType}/{version}:
    get:
      summary: Get ticket type details
      description: After you get the latest semantic version from the ticket-catalog route, plug this into the ticket-type-details route to dynamically receive the latest request schema with required and optional attributes needed per ticket type/version combination.
      operationId: getTicketTypeDetails
      tags:
        - Ticket Catalog
      parameters:
        - name: ticketType
          in: path
          required: true
          description: Ticket type returned from the get ticket catalog route.
          schema:
            type: string
            example: Technical Support
            enum:
              - Technical Support
              - Access Request
              - Billing
              - Customer Service
              - Remote Hands
        - name: version
          in: path
          required: true
          description: >-
            Semantic version returned from the get ticket catalog route.
          schema:
            type: string
            example: 1.0.0
            enum:
              - 1.0.0
              - 1.0.1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/technicalSupportTicketDetails'  
                  - $ref: '#/components/schemas/accessRequestTicketDetails'
                  - $ref: '#/components/schemas/billingTicketDetails'
                  - $ref: '#/components/schemas/customerServiceTicketDetails'
              examples:
                'Technical Support Ticket Details':
                  value:
                    apiVersion: v1
                    data:
                      attrs:
                        - name: ticketType
                          displayName: Ticket Type
                          description: Applicable ticket type from ticket catalog
                          criteria:
                            dataType: string
                            isRequired: true
                            anyRequired: []
                          value: Technical Support
                        - name: componentId
                          displayName: Component Id
                          description: Unique Id obtained from GET Existing Services Route
                          criteria: 
                            dataType: string
                            isRequired: false
                            anyRequired: 
                              - componentId, serviceId
                        - name: customerReferenceId
                          displayName: Customer Reference Id
                          description: Customer Input, reference specific to customer
                          criteria:
                            dataType: string
                            isRequired: false
                            anyRequired: []
                        - name: description
                          displayName: Description
                          description: Please provide a detailed statement of work
                          criteria:
                            dataType: string
                            isRequired: false
                            anyRequired: []
                        - name: downtimeInitialDate
                          displayName: Downtime Initial Date
                          description: ISO format date string of initial downtime
                          criteria:
                            dataType: string
                            isRequired: true
                            anyRequired: []
                        - name: downtimeInitialTime
                          displayName: Downtime Initial Time
                          description: ISO format time string of initial downtime
                          criteria:
                            dataType: string
                            isRequired: true
                            anyRequired: []
                        - name: serviceId
                          displayName: Service Id
                          description: Unique Id obtained from GET Existing Services Route
                          criteria:
                            dataType: string
                            isRequired: false
                            anyRequired: 
                              - componentId, serviceId
                        - name: serviceState
                          displayName: Service state
                          description: State of the service [Hard Down, Impaired, Request, Against, Service]
                          criteria:
                            dataType: string
                            isRequired: true
                            anyRequired: []
                          options:
                            - value: Hard Down
                              defaultValue: false
                              allowedForControllingFields: []
                            - value: Impaired
                              defaultValue: false
                              allowedForControllingFields: []
                            - value: Request Against Service
                              defaultValue: false
                              allowedForControllingFields: []
                        - name: subject
                          displayName: Subject
                          description: Summary of request
                          criteria:
                            dataType: string
                            isRequired: false
                            anyRequired: []
                      contacts:
                          - attrs:
                            - name: contactType 
                              displayName: Contact Type
                              description: Indicator of what this contact should be reached out for (Technical or Primary)
                              criteria:
                                dataType: string
                                isRequired: false
                                anyRequired: []
                              options:
                                - value: Primary
                                  defaultValue: false
                                  allowedForControllingFields: []
                                - value: Technical
                                  defaultValue: false
                                  allowedForControllingFields: []
                            - name: email
                              displayName: Email
                              description: Contact email
                              criteria:
                                dataType: string
                                isRequired: true
                                anyRequired: []
                            - name: fullName
                              displayName: Full Name
                              description: Contact full name
                              criteria:
                                dataType: string
                                isRequired: true
                                anyRequired: []
                            - name: phone
                              displayName: Phone 
                              description: Contact phone number
                              criteria:
                                dataType: string
                                isRequired: true
                                anyRequired: []
                            minCount: 1
                            maxCount: 20
                      troubleshooting:
                        attrs:
                          - name: circuitPassTraffic
                            displayName: Circuit Passing Traffic
                            description: Has this circuit passed traffice before?
                            criteria: 
                              dataType: boolean
                              isRequired: false
                              anyRequired: []
                          - name: disconnectedFibers
                            displayName: Disconnected Fibers
                            description: Has physical maintenance been performed that disconnected fibers?
                            criteria: 
                              dataType: boolean
                              isRequired: false
                              anyRequired: []
                          - name: gearOn
                            displayName: Gear on
                            description: Do you have physical or remote access to your gear?
                            criteria: 
                              dataType: boolean
                              isRequired: false
                              anyRequired: []
                          - name: interfaceReset
                            displayName: Interface Reset
                            description: Does your interface have Duplex settings enabled?
                            criteria: 
                              dataType: boolean
                              isRequired: false
                              anyRequired: []
                          - name: verifyLightLevels
                            displayName: Verify Light Levels
                            description: Have you verified input/output light levels?
                            criteria: 
                              dataType: boolean
                              isRequired: false
                              anyRequired: []
                        isRequired: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
  /services/service-management/v1/create-ticket:
    post:
      summary: Create ticket
      description: Create a ticket against your service. Associate your service via the `serviceId`, `componentId`, or `circuitId` returned from the Service Inventory route. 
      operationId: createTicket
      tags:
        - Ticketing
      requestBody:
        description: Ticket request body. There are different request bodies for each ticket type. Prerequisites include having reference to your service from the service inventory route and pass in either the `serviceId`, `componentId`, or `circuitId` key value pair in the request.
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/technicalSupportTicketRequest'
                - $ref: '#/components/schemas/accessRequestTicketRequest'
                - $ref: '#/components/schemas/billingTicketRequest'
      responses:
        '200':
          description: Success - Technical Support ticket type
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: New
                        enum: 
                          - New
                          - Isolation and Repair
                          - Service Restored
                          - Closed
                          - Action Required
                          - On-Hold
                          - Cancelled
                        description: Tickets will always start in the new status. Anytime a comment is made on the ticket, the status updates to Action Required. Typical status flow is - New > Isolation and Repair > Service Restored > Closed. Customer will be contacted after Service Restored to verify service status.
                      ticketId:
                        type: string
                        example: 5004z00001dIuveAAC
                      ticketNumber:
                        type: string
                        example: TTN-0005833575
                      customerReferenceId:
                        type: string
                        example: 'Zayo-239823'
                      dateTimeOpened:
                        type: string
                        example: 2022-04-25T20:29:49.000+0000
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
  /services/service-management/v1/ticket-comment:
    post:
      summary: Create ticket comment
      description: Add a ticket comment to directly communicate with the Zayo NOC team. Once a comment is added on a ticket, the ticket status will update to Action Required, so that it notifies our NOC teams. 
      operationId: addTicketComment
      tags:
        - Ticketing
      requestBody:
        description: Ticket comment request body. Either `ticketId` or `ticketNumber` is required.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - commentBody
                - contactEmail
                - contactName
                - ticketId
                - ticketNumber
              properties:
                ticketId: 
                  type: string
                  pattern: ^500
                  anyOf:
                    - maxLength: 15
                      minLength: 15
                    - maxLength: 18
                      minLength: 18
                  description: Ticket unique identifier. Either `ticketId` or `ticketNumber` is required.
                  example: 5000x00000BHrN2AAL
                ticketNumber:
                  type: string
                  description: Ticket unique Identifier, also used in Tranzact portal. Either `ticketId` or `ticketNumber` is required.
                  example: TTN-0003449133
                commentBody:
                  type: string
                  description: Comment content.
                  example: The problem was not resolved, please address.
                contactEmail:
                  type: string
                  format: email
                  description: Email of the user who is posting the comment.
                  example: wwhite@company.com
                contactName:
                  type: string
                  description: Name of the user who is posting the comment. 
                  example: Walter White
                customerReferenceId:
                  type: string
                  description: Internal reference identifier.
                  example: Ticket 1029342
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v1
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Ticket comment was successfully created
                      success:
                        type: boolean
                        example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
