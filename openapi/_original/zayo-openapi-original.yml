                        Dear Zayo Customer,\r\n\r\n<br><br>Please be advised that the scheduled maintenance window has been completed in its entirety for this event.\r\n<br><br><font color=\"FF0000\">If your services are still being impacted please take a moment to review the service and bounce any interfaces that may have been impacted.  In the event that this does not fully restore your service please contact the Zayo NCC at 866-236-2824 or at <u>zayoncc@zayo.com</u>.</font>\r\n\r\n<br><br><b>Maintenance Ticket #: </b> TTN-0003590895\r\n\r\n<br><br> <b>Maintenance Window: </b> 00:01 - 05:00 Pacific\r\n\r\n<br><br><b>1<sup>st</sup> Activity Date: </b> 15-Oct-2019\n\r\n\r\n<br><br><b>Location of Maintenance: </b> 2001 6th Ave, Seattle, WA\r\n\r\n<br><br><b>Reason for Maintenance: </b> Zayo will perform groom for network optimization.\r\n\r\n<br><br><b>Circuit(s) Affected: </b><br>\r\n<table border=3D\"1\"><tr>\n<tr>\n<th>Circuit Id</th>\n<th>Expected Impact</th>\n<th>A Location CLLI</th>\n\n<th>Z Location CLLI</th>\n<th>Legacy Circuit Id</th>\n</tr>\n<tr>\n<td>/IPYX/106744/   /ZYO /</td>\n<td>Hard Down - Duration of maintenance window</td>\n<td>STTLWACC000</td>\n<td>STTLWAWB012</td>\n<td></td>\n</tr>\n</table>\n\r\n\r\n<br><br>If you have any questions or need any additional information related to this maintenance event, please contact the MR group at mr@zayo.com or call 866-236-2824.\r\n\r\n<br><br>Regards,<br><p><b>\r\n<font color=\"808080\" size=\"3\" face=\"Times New Roman\">Zay</font><font color=\"FF9900\" size=\"3\" face=\"Times New Roman\">o </font>\r\n<font color=\"808080\" size=\"3\" face=\"Times New Roman\">Global Change Management Team/<i>Équipe de Gestion du Changement Global Zay</font><font color=\"FF9900\" size=\"3\" face=\"Times New Roman\">o</font></i><br>\r\n<font color=\"808080\" size=\"3\" face=\"Times New Roman\">Zay</font><font color=\"FF9900\" size=\"3\" face=\"Times New Roman\"><b>o </b></font>\r\n<font color=\"808080\" size=\"3\" face=\"Times New Roman\">Group/<i>Le Groupe Zay</font><font color=\"FF9900\" size=\"3\" face=\"Times New Roman\">o</font></i></b>\r\n<font size=\"2\" face=\"Times New Roman\">\r\n<br>Toll free/<i>N° sans frais</i>: <a href=\"tel:1-866-236-2824\">1.866.236.2824 </a>\r\n<br>United Kingdom Toll Free/<i>N° sans frais Royaume-Uni</i>: <a href=\"tel:0800-169-1646\">0800.169.1646</a>\r\n<br>Email/<i>Courriel</i>: <a href=\"mailto:mr@zayo.com\">mr@zayo.com</a>\r\n<br>Website/<i>Site Web</i>: <a href=\"https://www.zayo.com\">https://www.zayo.com</a>\r\n\r\n<p class=MsoNormal style='margin-bottom:0cm;margin-bottom:.0001pt;line-height:\r\nnormal'><a href=\"http://www.zayo.com/company/about-zayo/\" target=\"_blank\"><b><span\r\nlang=EN-US style='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:\r\nwhite;mso-ansi-language:EN-US'>About Zayo</span></b></a><span lang=EN-US\r\nstyle='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:white;\r\nmso-ansi-language:EN-US'>&nbsp;|&nbsp;</span><a\r\nhref=\"http://www.zayo.com/solutions/global-network/\" target=\"_blank\"><b><span\r\nlang=EN-US style='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:\r\nwhite;mso-ansi-language:EN-US'>Network</span></b></a><strong><span lang=EN-US\r\nstyle='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:white;\r\nmso-ansi-language:EN-US'>&nbsp;</span></strong><span lang=EN-US\r\nstyle='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:white;\r\nmso-ansi-language:EN-US'>|&nbsp;</span><a\r\nhref=\"https://tranzact.zayo.com/#!/escalation-lists\" target=\"_blank\"><b><span\r\nlang=EN-US style='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:\r\nwhite;mso-ansi-language:EN-US'>Escalation List</span></b></a><b><span\r\nlang=EN-US style='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:\r\nwhite;mso-ansi-language:EN-US'>&nbsp;</span></b><span lang=EN-US\r\nstyle='font-family:\"Helvetica\",sans-serif;color:#ED7D31;background:white;\r\nmso