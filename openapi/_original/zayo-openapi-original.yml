                      description: Term length of the service.
                      example: 12
                paging:
                  type: object
                  description: Object to define pagination for the number of records per page, and how many records to skip. Follows odata pagination standards.
                  required: [top, skip]
                  additionalProperties: false
                  properties:
                    top:
                      type: integer
                      description: Number of records to be returned per page. 
                      example: 50
                      default: 10
                      maximum: 50
                      minimum: 0
                    skip:
                      type: integer
                      description: Number of records to skip.
                      example: 0
                      default: 0
                      maximum: 500
                      minimum: 0
                search:
                  type: string
                  minLength: 3
                  example: Wave
      responses:
        '200':
          description: Success
