openapi: 3.1.0
info:
  version: '1.0'
  title: Zayo APIs
  description: >-
    Zayo offers free APIs to help make doing business with Zayo easier. The world is shifting from user-led interfaces to system-to-system integration through application programming interfaces. 
    Zayo, your trusted digital transformation partner, is ready to help.
    Seamless integration to Zayo’s Customer Portal responds to the growing need for automation.
    Discover how to expand your network, get quotes, order quotes, and manage your
    network with our Ticketing and Maintenance Cases API.    
  x-logo:
    url: 'https://zayo-ui-bucket.s3-us-west-2.amazonaws.com/Common/Logos/zayo-logo-orange.png'  
    altText: 'Zayo orange logo'
  contact:
    name: Zayo API Team
    email: zayoapi@zayo.com
servers:
  - url: https://api.zayo.com
    description: Production server
paths:
  /services/location-management/v2/buildings/validation:
    post:
      summary: Validate building addresses
      description: >-
        Validate any building in the world with a few parameters to see if Zayo is on net. Request an array of building addresses in a standard building format and you will either get matched or unmatched buildings. Matched buildings will return Zayo Network Status. Unmatched buildings might require alternative naming formats, otherwise, you can assume unmatched buildings are off net.  
        
        
        Once you have a Building Id, you can use the Locations route to get location-based information. A `buildingId` or `locationId` is required for quoting.
      operationId: validateBuildings
      tags:
        - Network Discovery
      requestBody:
        description: An array of building objects that will be validated against Zayo's systems. 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buildings:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    maxProperties: 7
                    minProperties: 2
                    maxItems: 20
                    minItems: 1
                    uniqueItems: true
                    required:
                      - address
                      - countryCode
                    properties:
                      address:
                        type: string
                        example: 60 Hudson Street
                        minLength: 3
                      neighborhood:
                        type: string
                      city:
                        type: string
                        example: New York
                      subregion:
                        type: string
                      region:
                        type: string
                      countryCode:
                        type: string
                        example: USA
                        minLength: 3
                        maxLength: 3
                      postal:
                        type: string
                        example: '80013'
            examples:
              Several Buildings:
                value:
                  buildings:
                    - address: 8 Buckingham Ave
                      city: Slough
                      subregion: ''
                      countryCode: GBR
                      postal: SL1 4AX
                    - address: 60 Hudson Street
                      neighborhood: Manhattan
                      city: New York
                      subregion: Manhattan
                      region: New York
                      countryCode: USA
                      postal: '10013'
                    - address: 123 Test Street
                      neighborhood: Test Neighborhood
                      city: Boulder
                      subregion: Test Subregion
                      region: CO
                      countryCode: USA
                      postal: '80303'
              One Building:
                value:
                  buildings:
                    - address: 60 Hudson Street
                      city: New York
                      region: New York
                      countryCode: USA
                      postal: '10013'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                  data:
                    type: object
                    properties:
                      matchedAddresses:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                            address:
                              type: string
                            matched_address:
                              type: string
                            city:
                              type: string
                            subregion:
                              type: ['null', string]
                            neighborhood:
                              type: ['null', string]
                            postal: 
                              type: string
                            region: 
                              type: ['null', string]
                            latitude:
                              type: number
                            longitude:
                              type: number
                            zayoNetworkStatus:
                              type: string
                              enum:
                                - On Zayo Network
                                - Not On Zayo Network
                            buildingClassification:
                              type: ['null', string]
                            competitiveInternetEnablement:
                              type: string
                            buildingId:
                              type: string
                      unmatchedAddresses:
                        type: array
                        items:
                          type: object
                          properties:
                            country:
                              type: string
                            address:
                              type: string
                            city:
                              type: string
                            subregion:
                              type: ['null', string]
                            neighborhood:
                              type: ['null', string]
                            postal:
                              type: string
                            region: 
                              type: ['null', string]
                            latitude:
                              type: number
                            longitude:
                              type: number
                            message:
                              type: string
                            zayoNetworkStatus: 
                              type: ['null', string]
                            buildingId:
                              type: ['null', string]
              examples:
                'Several Buildings':
                  value: 
                    apiVersion: v2
                    data:
                      matchedAddresses:
                        - buildingId: a0W600000009mrkEAA
                          matched_address: 60 Hudson St, New York, 10013
                          address: 60 Hudson Street
                          neighborhood: null
                          city: New York
                          subregion: null
                          region: null
                          country: USA
                          postal: '10013'
                          zayoNetworkStatus: On Zayo Network
                          buildingClassification: On-Net
                          competitiveInternetEnablements: 'Yes'
                          latitude: -74.00890867164877
                          longitude: 40.71790374632121
                        - buildingId: a0W60000002AmvsEAC
                          matched_address: 8 Buckingham Avenue, Slough, Berkshire, England, SL1 4
                          address: 8 Buckingham Ave
                          neighborhood: null
                          city: Slough
                          subregion: null
                          region: null
                          country: GBR
                          postal: SL1 4AX
                          zayoNetworkStatus: On Zayo Network
                          buildingClassification: null
                          competitiveInternetEnablements: 'Yes'
                          latitude: -0.6338168030935715
                          longitude: 51.52350290497991
                      unmatchedAddresses:
                        - buildingId: null
                          address: 123 Test Street
                          neighborhood: null
                          city: Boulder
                          subregion: null
                          region: CO
                          country: USA
                          postal: '80303'
                          zayoNetworkStatus: null
                          message: Unable to validate this address in the current format. Please reformat before resubmitting.
                'Matched Building':
                  value: 
                    apiVersion: v2
                    data:
                      matchedAddresses:
                        - buildingId: a0W600000009mrkEAA
                          matched_address: 60 Hudson St, New York, 10013
                          address: 60 Hudson Street
                          neighborhood: null
                          city: New York
                          subregion: null
                          region: null
                          country: USA
                          postal: '10013'
                          zayoNetworkStatus: On Zayo Network
                          buildingClassification: On-Net
                          competitiveInternetEnablements: 'Yes'
                          latitude: -74.00890867164877
                          longitude: 40.71790374632121
                'Unmatched Building':
                  value: 
                    apiVersion: v2
                    data:
                      unmatchedAddresses:
                        - buildingId: null
                          address: 123 Test Street
                          neighborhood: null
                          city: Boulder
                          subregion: null
                          region: CO
                          country: USA
                          postal: USA
                          zayoNetworkStatus: null
                          message: Unable to validate this address in the current format. Please reformat before resubmitting.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
              examples:
                'Missing Required Field':
                  value: 
                    apiVersion: v2
                    error: 
                      errorId: 797ac530-9326-917e-fa38-13d82e065ffe
                      code: 400
                      message: >- 
                        Error: Failed JSON Validation - [[0].countryCode - should NOT be shorter than 3 characters. limit: 3]
                      errors: []
  /services/location-management/v2/building/{buildingId}/locations:
    get:
      summary: Get locations
      description: >-
        View all locations for the specified building in the URL. Locations contain floor, room, and suite information as available, serviceability per product code, and network status. Locations are returned based on serviceability where most desirable locations are returned first. 
        
        
        Serviceability is represented by enabled and preferred. Enabled means Zayo can service that product at that location. Preferred means this location is Zayo's preferred location to service. For example, cross connects might not be required at preferred locations. There will only ever be 1 location for each preferred product, while several locations can be enabled for each product. 
      operationId: getLocations
      tags:
        - Network Discovery
      parameters:
        - name: buildingId
          in: path
          required: true
          description: >-
            `buildingId` returned from the validate building address route.
          schema:
            type: string
            example: a0W60000002BxA8EAK
            pattern: ^[a-zA-Z0-9]{18}$
            maxLength: 18
            minLength: 18
        - name: productCode
          in: query
          required: false
          description: >-
            `productCode` query param will only return locations where the specified `productCode` values are enabled (and is required when `enabled` is populated).
          schema:
            type: array
            maxItems: 9
            minItems: 0
            uniqueItems: true
            items:
              type: string
              example: [ETH-ELINE-P2P, WAVES-STD-P2P]
              enum:
                - ETH-ELAN-M2M
                - ETH-ELINE-NNI
                - ETH-ELINE-P2P
                - ETH-ELINE-UNI
                - ETH-PDN-P2P
                - IP-DIA
                - IP-DIA-AGG
                - IP-VPN
                - WAVES-STD-P2P
        - name: enabled
          in: query
          required: false
          schema:
            type: string
            example: any
            default: any
            enum:
              - any
              - all
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    example: v2
                  data:
                    type: object
                    properties:
                      buildingId:
                        type: string
                        example: a0W60000002BxA8EAK
                      address:
                        type: string
                        example: 9417 Corporate Lake Dr, Tampa, Florida, 33634
                      zayoNetworkStatus:
                        type: string
                        example: On Zayo Network
                      locations:
                        type: array
                        items:
                          type: object
                          properties:
                            locationName:
                              type: string
                              example: 9417 Corporate Lake Dr/Fl-1/Rm-MMR
                            locationId:
                              type: string
                              example: a0b6000000Avil2AAB
                            networkStatus:
                              type: string
                              example: On Zayo Network
                            buildingClassification:
                              type: ['null', string]
                            competitiveInternetEnablement:
                              type: string
                            suite:
                              type: ['null', string]
                            floor:
                              type: string
                              example: '1'
                            room:
                              type: string
                              example: MMR
                            enabled:
                              type: object
                              properties:
                                ETH-ELAN-M2M:
                                  type: boolean
                                  example: true
                                ETH-ELINE-NNI:
                                  type: boolean
                                  example: true
                                ETH-ELINE-P2P:
                                  type: boolean
                                  example: true
                                ETH-ELINE-UNI:
                                  type: boolean
                                  example: true
                                ETH-PDN-P2P:
                                  type: boolean
                                  example: false
                                IP-DIA:
                                  type: boolean
                                  example: true
                                IP-DIA-AGG:
                                  type: boolean
                                  example: true
                                IP-VPN:
                                  type: boolean
                                  example: true
                                WAVES-STD-P2P:
                                  type: boolean
                                  example: false
                            preferred:
                              type: object
                              properties:
                                ETH-ELAN-M2M:
                                  type: boolean
                                  example: true
                                ETH-ELINE-NNI:
                                  type: boolean
                                  example: true
                                ETH-ELINE-P2P:
                                  type: boolean
                                  example: true
                                ETH-ELINE-UNI:
                                  type: boolean
                                  example: true
                                ETH-PDN-P2P:
                                  type: boolean
                                  example: false
                                IP-DIA:
                                  type: boolean
                                  example: true
                                IP-DIA-AGG:
                                  type: boolean
                                  example: true
                                IP-VPN:
                                  type: boolean
                                  example: true
                                WAVES-STD-P2P:
                                  type: boolean
                                  example: false
                      messages:
                        type: array
                        items:
                          type: string
              examples:
                'On Net and Off Net Locations':
                  value: 
                    apiVersion: v2
                    data:
                        buildingId: a0W60000002BxA8EAK
                        address: 9417 Corporate Lake Dr, Tampa, Florida, 33634
                        zayoNetworkStatus: On Zayo Network
                        locations:
                          - locationName: 9417 Corporate Lake Dr/Fl-1/Rm-MMR
                            locationId: a0b6000000Avil2AAB
                            networkStatus: On Zayo Network
                            buildingClassification: On-Net
                            competitiveInternetEnablement: 'Yes'
                            suite: null
                            floor: '1'
                            room: MMR
                            enabled:
                                ETH-ELAN-M2M: true
                                ETH-ELINE-NNI: true
                                ETH-ELINE-P2P: true
                                ETH-ELINE-UNI: true
                                ETH-PDN-P2P: false
                                IP-DIA: true
                                IP-DIA-AGG: true
                                IP-VPN: true
                                WAVES-STD-P2P: false
                            preferred:
                                ETH-ELAN-M2M: true
                                ETH-ELINE-NNI: true
                                ETH-ELINE-P2P: true
                                ETH-ELINE-UNI: true
                                ETH-PDN-P2P: false
                                IP-DIA: true
                                IP-DIA-AGG: true
                                IP-VPN: true
                                WAVES-STD-P2P: false
                          - locationName: 9417 Corporate Lake Dr/Fl-1/Rm-MPOE
                            locationId: a0b4z00000QwxoRAAR
                            networkStatus: Not on Zayo Network
                            buildingClassification: On-Net
                            competitiveInternetEnablement: 'Yes'
                            suite: null
                            floor: '1'
                            room: MPOE
                            enabled:
                                ETH-ELAN-M2M: false
                                ETH-ELINE-NNI: false
                                ETH-ELINE-P2P: false
                                ETH-ELINE-UNI: false
                                ETH-PDN-P2P: false
                                IP-DIA: false
                                IP-DIA-AGG: false
                                IP-VPN: false
                                WAVES-STD-P2P: false
                            preferred:
                                ETH-ELAN-M2M: false
                                ETH-ELINE-NNI: false
                                ETH-ELINE-P2P: false
                                ETH-ELINE-UNI: false
                                ETH-PDN-P2P: false
                                IP-DIA: false
                                IP-DIA-AGG: false
                                IP-VPN: false
                                WAVES-STD-P2P: false
                        messages: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
              examples:
                'Incorrect buildingId format':
                  value: 
                    apiVersion: v2
                    error: 
                      errorId: 4863bed3-9220-9a6b-dac9-9cd0abeae6c7
                      code: 400
                      message: >- 
                        Error: Failed Parameter Validation - [.buildingSfid - should NOT be shorter than 18 characters. limit: 18], [.buildingSfid - should match pattern \"^[a-zA-Z0-9]{18}$\". pattern: ^[a-zA-Z0-9]{18}$]
                      errors: []
  /services/quote-management/v2/sites/available-cloud-providers:
    post:
      summary: Get cloud sites
      description: >- 
        Search for cloud on-ramp locations based on `productCodes`, `buildingIds`, `cloudProviders`, and `connectionTypes` values to get over 200 cloud on-ramp options. Filter option values are case sentitive. Providers include - Amazon AWS, Google Cloud, Microsoft Azure / Office365, IBM Cloud, Salesforce, Twilio, and many more!
        
        
        Cloud on-ramp locations are returned per building and grouped in the desinations array. Within the destinations array, cloud on-ramps are returned based on the demarc (floor, room, suite), product code, and then connection type. Once you get down to the `connectionType` level, you will see available bandwidths for that Connection Type, for that product, for that cloud on ramp/demarc. Zayo will provide Dedicated connections at all of our cloud on-ramp locations, but we don't support Hosted at all the locations.
        
        
        We recommend you apply filters to get the specific data you need to place a quote, otherwise if you are mapping Zayo's cloud serviceability, feel free to send in an empty request object. Please note, there is not pagination with this route.
        
        
          *Please note: at this time only ETH-ELINE-UNI and ETH-ELINE-P2P product codes can be quoted with a cloudSite. You will apply `cloudProvider` key value pair from the `destinations` array, `connectionType` key value pair from the `destinationDetails` array,  and `locationId` key value pair from the `destinations` array to your quote request.*
      operationId: getCloudSites
      tags:
        - Network Discovery
      requestBody:
        description: >- 
          Apply filters to return a list of cloud sites to quote to available Zayo products. Filter options include - cloudProviders, connectionTypes, productCodes, and buildingIds. 
          
          `cloudProviders` options are case-sensitive and include: Amazon AWS, Microsoft Azure / Office365, Google Cloud, Oracle Cloud, Microsoft Cloud for Government, IBM Cloud, Salesforce, Cisco Webex Edge Connect, Alibaba, OVH, Cloudflare, Accenture, ADISTA, AIS Business Cloud, Ajubeo, Artisan Infrastructure, Carpathia Hosting, DataBank Cloud Services, Day 1 Solutions, Enovance, Expedient, Flexential: FlexAnywhere, Fullsave, GROUPE RDI, Hosting.com, Ikoula, IntelePeer, Internap, Linkbynet, Lunavi Inc, NetDepot, Nimbix, Outscale, Oxalide, Packet, Phoenix NAP, QTS Cloud Services, RapidScale, Scale Matrix, StratoGen, The Faction Group, Twilio, Virtustream, Vitelity Cloud, VMware Cloud on AWS, Wasabi Cloud, Xtium.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: 
                filters:
                  type: object
                  additionalProperties: false
                  description: Object to define filter options.
                  not:
                    required:
                      - buildingIds
                      - locationIds
                  properties:
                    productCodes: 
                      type: array
                      description: Apply multiple product code options. `productCode` returned from the product catalog route. At this time, only ETH-ELINE-UNI and ETH-ELINE-P2P product codes can be quoted with a cloud site.
                      items: 
                        type: string
                        example: ETH-ELINE-UNI
                        enum:
                          - ETH-ELINE-UNI
                          - ETH-ELINE-P2P
                    buildingIds:
                      type: array
                      description: Apply multiple `buildingId` options. `buildingId` returned from the validate building address route. `buildingIds` or `locationIds` can be provided (but not both).
                      items:
                        type: string
                        pattern: ^a0W
                        minLength: 18
                        maxLength: 18
                        example: a0W600000009moPEAQ
                    locationIds:
                      type: array
                      description: Apply multiple `locationId` options. `locationId` returned from the get locations route. `buildingIds` or `locationIds` can be provided (but not both).
                      items:
                        type: string
                        pattern: ^a0b
                        minLength: 18
                        maxLength: 18
                        example: a0b60000000TURgAAO
                    cloudProviders:
                      type: array
                      description: Apply multiple cloudProvider options.
                      maxItems: 5
                      items:
                        type: string
                        example: Amazon AWS
                        enum:
                          - Amazon AWS
                          - Microsoft Azure / Office365
                          - Google Cloud
                          - Oracle Cloud
                          - Microsoft Cloud for Government
                          - IBM Cloud
                          - Salesforce
                          - Cisco Webex Edge Connect
                          - Alibaba
                          - OVH
                          - Cloudflare
                          - Accenture
                          - ADISTA
                          - AIS Busines
                          - Cloud
                          - Ajubeo
                          - Artisan Infrastructure
                          - Carpathia Hosting,
                          - ataBank Cloud Services
                          - Day 1 Solutions
                          - Enovance
                          - Expedient
                          - >- 
                            Flexential: FlexAnywhere
                          - Fullsave
                          - GROUPE RDI
                          - Hosting.com
                          - Ikoula
                          - IntelePeer
                          - Internap
                          - Linkbynet
                          - Lunavi Inc
                          - NetDepot
                          - Nimbix
                          - Outscale
                          - Oxalide
                          - Packet
                          - Phoenix NAP
                          - QTS Cloud Services
                          - RapidScale
                          - Scale Matrix
                          - StratoGen
                          - The Faction Group,
                          - wilio
                          - Virtustream
                          - Vitelity Cloud
                          - VMware Cloud on AWS
                          - Wasabi Cloud
                          - Xtium
                    connectionTypes:
                      type: array
                      maxItems: 2
                      uniqueItems: true
                      description: Apply connection type options - Direct, Hosted, or Dedicated. 
                      items:
                        type: string
                        example: Dedicated
                        enum:
                          - Direct
                          - Hosted
                          - Dedicated      
            examples:
              By Building(s):
                value:
                  filters:
                    productCodes: [ETH-ELINE-UNI]
                    buildingIds: [a0W600000009moPEAQ]
                    cloudProviders: [Google Cloud]
                    connectionTypes: [Direct]
              By Location(s):
                value:
                  filters:
                    productCodes: [ETH-ELINE-P2P]
                    locationIds: [a0b60000006E5q2AAC]
                    cloudProviders: [Amazon AWS, Google Cloud]
                    connectionTypes: [Dedicated, Hosted]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                    apiVersion:
                      type: string
                      example: v2
                    data:
                      type: array
                      items: 
                        type: object
                        properties:
                          buildingId:
                            type: string
                            example: a0W600000009mrjEAA
                          buildingAddress:
                            type: string
                            example: 32 Avenue Of The Americas, New York, NY 10013 USA
                          destinations:
                            type: array
                            items: 
                              type: object
                              properties:
                                building:
                                  type: string
                                  example: 32 Avenue Of The Americas
                                cloudProvider:
                                    type: string
                                    example: Amazon AWS
                                demarc: 
                                    type: string
                                    example: Fl-7/Ste-Coresite/Rm-700
                                destinationDetails:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      productCode:
                                        type: string
                                        example: ETH-ELINE-UNI
                                      aggregatedBandwidth: 
                                        type: string
                                        example: No
                                      connectionType:
                                        type: object
                                        properties:
                                          hosted:
                                            type: object
                                            properties:
                                              bandwidths: 
                                                type: array
                                                items:
                                                  type: string
                                                  example: 10Mb, 20Mb, 30Mb, 40Mb, 50Mb, 60Mb, 70Mb, 80Mb, 90Mb, 100Mb
                                              evcEnabled:
                                                type: boolean
                                                example: true
                                                description: Designates whether a cloud on-ramp is eligible for same-day provisioning. This is only available for hosted connections for ETH-ELINE-UNI products.
                                          dedicated:
                                            type: object
                                            properties:
                                              bandwidths:
                                                type: array
                                                items:
                                                  type: string
                                                  example: 10Mb, 20Mb, 30Mb, 40Mb, 50Mb, 60Mb, 70Mb, 80Mb, 90Mb, 100Mb
                                destinationName:
                                  type: string
                                  example: US East (N. Virginia)
                                latitude: 
                                  type: number
                                  example: 40.719979
                                locationId:
                                  type: string
                                  example: a0b60000000VmskAAC
                                  description: Use this value in the quote request payload when quoting to a cloud on-ramp.
                                longitude:
                                  type: number
                                  example: -74.004689
                                region:
                                  type: string
                                  example: us-east-1
                                zone:
                                  type: string
                                  example: CS32A
              examples:
                'Hosted Amazon AWS Options for ETH-ELINE-UNI':
                  value: 
                    apiVersion: v2
                    data:
                      - buildingId: a0W60000002BG6REAW
                        buildingAddress: 15 Pioneer Walk, Singapore, 627753 Singapore
                        destinations:
                          - building: Equinix SG2
                            cloudProvider: Amazon AWS
                            demarc: Fl-1/Rm-MPOE
                            destinationDetails:
                              - productCode: ETH-ELINE-UNI
                                aggregatedBandwidth: No
                                connectionType: 
                                  hosted:
                                    bandwidths:
                                    - 10Mb
                                    - 20Mb
                                    - 30Mb
                                    - 40Mb
                                    - 50Mb
                                    - 60Mb
                                    - 70Mb
                                    - 80Mb
                                    - 90Mb
                                    - 100Mb
                                    - 200Mb
                                    - 300Mb
                                    - 400Mb
                                    - 500Mb
                                    - 600Mb
                                    - 700Mb
                                    - 800Mb
                                    - 900Mb
                                    - 1G
                                    - 2G
                                    - 3G
                                    - 5G
                                    - 250Mb
                                    evcEnabled: true
                            destinationName: Asia Pacific (Signapore)
                            latitude: 1.32187
                            locationId: a0b60000003MZCQAA4
                            longitude: 103.695274
                            region: ap-southeast-1
                            zone: EQSG2
                      - buildingId: a0W60000008EahnEAC
                        buildingAddress: 800 Rue du Square-Victoria, Montreal, QC H4Z 1A1 Canada
                        destinations:
                          - building: eStruxture MTL-1
                            cloudProvider: Amazon AWS
                            demarc: Fl-SS1/Rm-MMR1
                            destinationDetails:
                              - productCode: ETH-ELINE-UNI
                                aggregatedBandwidth: No
                                connectionType: 
                                  hosted:
                                    bandwidths:
                                    - 10Mb
                                    - 20Mb
                                    - 30Mb
                                    - 40Mb
                                    - 50Mb
                                    - 60Mb
                                    - 70Mb
                                    - 80Mb
                                    - 90Mb
