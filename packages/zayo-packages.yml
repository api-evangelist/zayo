description: >-
  Zayo Group publishes no first-party client libraries. The Developer Portal documents
  raw HTTP + OAuth 2.0 client-credentials usage only (curl examples), and offers a
  downloadable OpenAPI definition at https://developer.zayo.com/openapi/zayo.yaml as the
  integration artifact instead of SDKs. Consumers are expected to generate their own
  clients from that document, or to integrate via one of the third-party integrators
  Zayo names in its FAQ.
