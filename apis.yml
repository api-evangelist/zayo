aid: zayo
name: Zayo
description: >-
  Zayo is a global communications infrastructure provider operating one of the
  largest independent fiber networks, delivering bandwidth, dark fiber, wavelengths,
  ethernet, IP, cloud connectivity and network management to carriers, enterprises,
  and hyperscalers. Zayo publishes a free public developer program at developer.zayo.com
  exposing REST APIs for network discovery (building validation, location and cloud-site
  lookup), quote and order management (product catalog, quoting, ordering), and service
  management (service inventory, ticketing, and maintenance-case notifications). The
  APIs are OpenAPI 3.1 described, secured with OAuth 2.0 client-credentials bearer tokens,
  and include a push-notification/callback surface for maintenance and ticket updates.
